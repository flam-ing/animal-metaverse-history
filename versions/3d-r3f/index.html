<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMALVERSE — 노을 군도 (React Three Fiber)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #root { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: #2a1830; color: #fff3ea; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; touch-action: none; }
  .hidden { display: none !important; }

  /* 동화책 종이 질감 + 비네트 — 화면 전체 오버레이 */
  #storybook-overlay {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(66,30,46,0.28) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.05'/></svg>");
  }

  #sel-title { position: fixed; top: 30px; left: 38px; z-index: 20; pointer-events: none; }
  #sel-title h1 {
    font-size: 34px; letter-spacing: 4px;
    background: linear-gradient(120deg, #ffd27a, #ff9ec5, #b98cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(255,160,120,.4));
  }
  #sel-title p { margin-top: 8px; font-size: 14px; color: #f0c0b0; }

  #char-panel {
    position: fixed; top: 20px; right: 20px; bottom: 20px; width: 400px; z-index: 20;
    display: flex; flex-direction: column;
    background: rgba(52,28,44,0.62); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,180,150,0.22); border-radius: 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  #char-panel h2 { padding: 18px 22px 10px; font-size: 16px; color: #ffc9a8; letter-spacing: 1px; }
  #char-grid { flex: 1; overflow-y: auto; padding: 6px 16px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
  #char-grid::-webkit-scrollbar { width: 8px; }
  #char-grid::-webkit-scrollbar-thumb { background: #7a4458; border-radius: 4px; }
  .ccard { background: rgba(74,40,58,0.7); border: 2px solid transparent; border-radius: 16px; padding: 10px 4px 8px; text-align: center; cursor: pointer; transition: transform .14s, border-color .14s, background .14s; }
  .ccard:hover { transform: translateY(-3px); background: rgba(96,52,74,0.8); border-color: #ff9ec5; }
  .ccard.sel { border-color: #ffd27a; background: rgba(110,60,80,0.9); box-shadow: 0 0 18px rgba(255,210,122,.35); }
  .ccard .ce { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .ccard .cn { font-size: 12.5px; font-weight: 700; color: #ffe6da; margin-top: 6px; }

  #info-card { position: fixed; left: 38px; bottom: 34px; width: 340px; z-index: 20; background: rgba(52,28,44,0.66); backdrop-filter: blur(12px); border: 1px solid rgba(255,180,150,0.22); border-radius: 20px; padding: 20px 24px; box-shadow: 0 12px 34px rgba(0,0,0,0.4); }
  #info-name { font-size: 25px; font-weight: 800; }
  #info-name .en { font-size: 13px; font-weight: 500; color: #e0a898; margin-left: 8px; }
  #info-intro { margin-top: 8px; font-size: 14px; line-height: 1.55; color: #e8ccc0; min-height: 42px; }
  #enter-btn { margin-top: 14px; width: 100%; border: none; cursor: pointer; background: linear-gradient(120deg, #ff9e5e, #ff6ea0); color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 4px; padding: 13px 0; border-radius: 14px; box-shadow: 0 6px 20px rgba(255,120,120,0.5); font-family: inherit; transition: transform .14s, box-shadow .14s; }
  #enter-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(255,120,120,0.6); }

  #zone-chip { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(52,28,44,0.75); padding: 8px 24px; border-radius: 999px; font-size: 15px; font-weight: 700; border: 1px solid rgba(255,180,150,0.25); }
  #controls-hint { position: fixed; left: 20px; bottom: 18px; z-index: 10; background: rgba(52,28,44,0.7); padding: 9px 16px; border-radius: 12px; font-size: 12.5px; line-height: 1.6; color: #f0d8ce; }
  #controls-hint b { color: #ffd27a; }
  #interact-hint { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); z-index: 10; background: linear-gradient(120deg, #ff9e5e, #ff6ea0); color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 15px; font-weight: 700; box-shadow: 0 6px 18px rgba(255,120,120,0.5); animation: bob 1.2s ease-in-out infinite; }
  #interact-hint .key { background: #fff; color: #d0568a; border-radius: 7px; padding: 1px 9px; margin-right: 8px; font-weight: 800; }
  @keyframes bob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,-5px); } }
  #dialogue { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); width: min(640px, 90vw); z-index: 10; background: rgba(52,28,44,0.92); backdrop-filter: blur(10px); border-radius: 20px; padding: 18px 26px 14px; border: 1px solid rgba(255,180,150,0.3); box-shadow: 0 14px 40px rgba(0,0,0,0.5); }
  #dlg-name { font-size: 15px; font-weight: 800; color: #ffd27a; }
  #dlg-name .role { font-size: 12px; color: #e0a898; font-weight: 600; margin-left: 8px; }
  #dlg-text { margin-top: 10px; font-size: 16px; line-height: 1.65; min-height: 48px; }
  #dlg-next { text-align: right; font-size: 12px; color: #d0a898; margin-top: 4px; }
  #dlg-next .key { background: #6a3448; border-radius: 5px; padding: 0 6px; font-weight: 700; }
  #toast { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(52,28,44,0.85); padding: 12px 34px; border-radius: 999px; font-size: 19px; font-weight: 800; opacity: 0; transition: opacity .35s, top .35s; border: 1px solid rgba(255,180,150,0.3); }
  #toast.show { opacity: 1; top: 96px; }
  #toast .sub { display: block; font-size: 12px; font-weight: 500; opacity: 0.8; text-align: center; margin-top: 2px; }
  #loading { position: fixed; inset: 0; z-index: 50; background: #2a1830; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #ffd27a; font-weight: 700; transition: opacity .4s; }
  #loading .spin { width: 42px; height: 42px; border-radius: 50%; border: 5px solid #4a2838; border-top-color: #ffd27a; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "three": "https://esm.sh/three@0.160.1",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.19?external=react,react-dom,three"
  }
}
</script>
</head>
<body>
<div id="loading"><div class="spin"></div>노을 군도를 여는 중…</div>
<div id="root"></div>
<div id="storybook-overlay"></div>

<script src="../../shared/characters.js"></script>
<script src="../../shared/npcs.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-type="module" data-presets="react" src="app.jsx"></script>
</body>
</html>
