<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMALVERSE — 도트 빌리지</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14121c; }
  body {
    font-family: "DungGeunMo", "Galmuri11", monospace, "Apple SD Gothic Neo";
    color: #f4ecd8; letter-spacing: 0.5px;
    -webkit-user-select: none; user-select: none;
    image-rendering: pixelated;
  }
  .pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
  .hidden { display: none !important; }

  /* ── 선택 화면 ──────────────────────── */
  #select {
    position: fixed; inset: 0; z-index: 20;
    background:
      repeating-linear-gradient(0deg, #1a1726 0, #1a1726 2px, #171320 2px, #171320 4px),
      radial-gradient(ellipse at 50% 30%, #2a2440, #12101a 75%);
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 16px;
  }
  #select h1 {
    font-size: 30px; letter-spacing: 6px; color: #ffd94a;
    text-shadow: 3px 3px 0 #b5722e, 0 0 0 #000;
    -webkit-text-stroke: 1px #5a431a;
  }
  #select .sub { margin-top: 8px; font-size: 12px; color: #a89ac8; letter-spacing: 2px; }
  #grid {
    margin-top: 18px; width: min(760px, 96vw);
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    max-height: 46vh; overflow-y: auto; padding: 8px;
    background: rgba(10,8,16,0.5);
    border: 3px solid #3a3352; border-radius: 4px;
  }
  #grid::-webkit-scrollbar { width: 10px; }
  #grid::-webkit-scrollbar-track { background: #1c1830; }
  #grid::-webkit-scrollbar-thumb { background: #4a4168; border: 2px solid #1c1830; }
  .cell {
    background: #211c33; border: 3px solid #372f4e; border-radius: 3px;
    padding: 4px 2px 5px; text-align: center; cursor: pointer;
    transition: none;
  }
  .cell:hover { border-color: #7d6bb0; background: #2b2440; }
  .cell.sel { border-color: #ffd94a; background: #3a2f22; box-shadow: 0 0 0 2px #ffd94a inset; }
  .cell canvas { width: 64px; height: 64px; display: block; margin: 0 auto; image-rendering: pixelated; }
  .cell .nm { font-size: 10px; margin-top: 2px; color: #d8cdb0; }

  #preview {
    margin-top: 16px; width: min(760px, 96vw);
    display: flex; align-items: center; gap: 18px;
    background: rgba(10,8,16,0.55); border: 3px solid #3a3352;
    padding: 14px 18px; border-radius: 4px;
  }
  #pv-canvas { width: 96px; height: 96px; image-rendering: pixelated; flex: 0 0 auto; background: #14111e; border: 2px solid #2a2440; }
  #pv-info { flex: 1 1 auto; min-width: 0; }
  #pv-name { font-size: 18px; color: #ffe27a; }
  #pv-name .en { font-size: 11px; color: #9c8fbf; margin-left: 8px; }
  #pv-intro { font-size: 12px; color: #c7bce0; margin-top: 6px; line-height: 1.6; min-height: 30px; }
  #enter {
    flex: 0 0 auto; font-family: inherit; cursor: pointer;
    font-size: 15px; letter-spacing: 3px; color: #14121c;
    background: #ffd94a; border: none;
    border-bottom: 4px solid #b5722e; border-right: 3px solid #b5722e;
    padding: 12px 26px; border-radius: 2px;
  }
  #enter:active { transform: translate(1px, 2px); border-bottom-width: 2px; }
  #enter:disabled { background: #5a5470; border-color: #3a3550; color: #2a2740; cursor: default; }

  /* ── 월드 ──────────────────────────── */
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; image-rendering: pixelated; background: #6db56a; }

  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #guide {
    position: absolute; left: 12px; top: 12px;
    font-size: 12px; color: #fff; background: rgba(20,16,28,0.7);
    border: 2px solid #4a4168; padding: 7px 12px;
    line-height: 1.7;
  }
  #guide b { color: #ffd94a; }
  #zone {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    font-size: 18px; letter-spacing: 4px; color: #fff;
    background: rgba(20,16,28,0.82); border: 3px solid #ffd94a;
    padding: 8px 26px; opacity: 0; transition: opacity 0.3s;
    text-shadow: 2px 2px 0 #000;
  }
  #zone .zh { display: block; font-size: 11px; letter-spacing: 1px; color: #cbb98a; margin-top: 3px; text-shadow: none; }
  #zone.show { opacity: 1; }
  #interact {
    position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: #14121c; background: #ffd94a;
    border: 2px solid #b5722e; padding: 6px 16px;
    animation: blink 0.9s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0.55; } }
  #dialog {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(660px, 92vw); pointer-events: auto;
    background: #17131f; border: 4px solid #ffd94a;
    padding: 16px 20px 12px;
    box-shadow: 0 0 0 4px #17131f, 0 8px 0 4px rgba(0,0,0,0.4);
  }
  #dlg-name { font-size: 14px; color: #ffd94a; letter-spacing: 1px; }
  #dlg-name .rl { color: #a89ac8; font-size: 11px; margin-left: 8px; }
  #dlg-text { margin-top: 10px; font-size: 15px; line-height: 1.7; color: #f4ecd8; min-height: 52px; }
  #dlg-next { text-align: right; font-size: 11px; color: #8a7fb0; margin-top: 4px; }
  #dlg-next .k { color: #ffd94a; }
</style>
</head>
<body>

<!-- 선택 화면 -->
<div id="select">
  <h1>ANIMALVERSE</h1>
  <div class="sub">도트 빌리지 · 함께 살아갈 동물을 골라라</div>
  <div id="grid"></div>
  <div id="preview">
    <canvas id="pv-canvas" width="24" height="24"></canvas>
    <div id="pv-info">
      <div id="pv-name">▶ 동물을 선택하세요</div>
      <div id="pv-intro"></div>
    </div>
    <button id="enter" disabled>입 장</button>
  </div>
</div>

<!-- 월드 -->
<canvas id="game" class="hidden"></canvas>
<div id="hud" class="hidden">
  <div id="guide">이동 <b>WASD / 방향키</b><br>대화 <b>E</b></div>
  <div id="zone"><span id="zone-name"></span><span class="zh" id="zone-hint"></span></div>
  <div id="interact" class="hidden"><span>E</span> 대화</div>
  <div id="dialog" class="hidden">
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div id="dlg-next"><span class="k">E</span> 다음 ▸</div>
  </div>
</div>

<script src="../../shared/characters.js"></script>
<script src="../../shared/npcs.js"></script>
<script src="sprites.js"></script>
<script src="world.js"></script>
<script src="game.js"></script>
</body>
</html>
