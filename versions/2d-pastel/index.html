<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMALVERSE — 파스텔 파크</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 선택 화면 -->
<div id="select">
  <h1>ANIMALVERSE</h1>
  <div class="sub">파스텔 파크 · 함께 산책할 동물을 골라 주세요 🌸</div>
  <div id="grid"></div>
  <div id="preview">
    <canvas id="pv-canvas" width="192" height="220"></canvas>
    <div id="pv-info">
      <div id="pv-name">동물을 선택해 주세요</div>
      <div id="pv-intro"></div>
    </div>
    <button id="enter" disabled>입 장</button>
  </div>
</div>

<!-- 월드 -->
<canvas id="game" class="hidden"></canvas>
<div id="hud" class="hidden">
  <div id="guide">이동 <b>WASD / 방향키</b> · 대화 <b>E</b></div>
  <div id="zone"><span class="zn" id="zone-name"></span><span class="zh" id="zone-hint"></span></div>
  <div id="interact" class="hidden"><span class="k">E</span> 대화</div>
  <div id="dialog" class="hidden">
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div id="dlg-next"><span class="k">E</span> 다음 ▸</div>
  </div>
</div>

<script src="../../shared/characters.js"></script>
<script src="../../shared/npcs.js"></script>
<script src="js/chibi.js"></script>
<script src="js/game.js"></script>
</body>
</html>
