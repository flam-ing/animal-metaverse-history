<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMALVERSE — 두근두근 아일랜드 (미연시 RPG)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #ffd7e6;
    --lavender: #d9c8f5;
    --ink: #4a3345;
    --accent: #e86a92;
  }
  html, body { height: 100%; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #fff0f6 0%, #ffe1ee 35%, #ecd9fb 70%, #ded0f7 100%);
    color: var(--ink);
    overflow-x: hidden;
    position: relative;
  }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }

  /* ── 떠다니는 하트/꽃 데코 (CSS 전용, 모션 감소 존중) ─────── */
  #deco { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  #deco span {
    position: absolute; bottom: -10%;
    font-size: 1.5rem; opacity: 0;
    color: #fff; text-shadow: 0 0 6px rgba(255,255,255,.7);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    12%  { opacity: .65; }
    88%  { opacity: .5; }
    100% { transform: translateY(-115vh) rotate(30deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #deco span { animation: none; display: none; }
  }

  /* ── HUD ───────────────────────────────────────────── */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(6px);
    border-bottom: 2px solid #ffffffaa;
    box-shadow: 0 4px 16px rgba(120,70,100,.08);
    font-size: .92rem;
  }
  #hud[hidden] { display: none; }
  #hudDay { font-weight: 700; }
  #hudStats { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .stat-chip {
    background: #ffffffcc; border-radius: 999px; padding: 3px 10px;
    font-size: .85rem; font-weight: 600; border: 1px solid #f0d5e2;
  }
  .btn-ghost {
    background: transparent; border: 1.5px solid var(--accent); color: var(--accent);
    border-radius: 999px; padding: 6px 14px; font-size: .85rem; font-weight: 700;
    transition: background .15s ease;
  }
  .btn-ghost:hover { background: #ffe1ee; }

  /* ── 화면(섹션) 공통 ───────────────────────────────── */
  main { position: relative; z-index: 1; min-height: 100vh; }
  .screen {
    display: none;
    min-height: 100vh;
    flex-direction: column; align-items: center;
    padding: 90px 20px 40px;
  }
  .screen.active { display: flex; }
  #scr-title.active, #scr-name.active { padding-top: 40px; }

  h1.game-title { font-size: 2.4rem; letter-spacing: 2px; color: var(--accent); text-align: center; }
  .game-sub { margin-top: 8px; color: #8a6f80; font-size: 1rem; text-align: center; }

  .btn-row { display: flex; gap: 14px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  .btn-primary {
    background: linear-gradient(135deg, #f486ac, #cd8ae8);
    color: #fff; border: none; border-radius: 999px;
    padding: 13px 30px; font-size: 1.02rem; font-weight: 700;
    box-shadow: 0 8px 20px rgba(200,90,150,.28);
    transition: transform .15s ease;
  }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-primary:disabled { opacity: .4; box-shadow: none; transform: none; }

  /* 타이틀 캐스트 미리보기 */
  #castPreview {
    margin-top: 40px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 16px; max-width: 900px; width: 100%;
  }
  .cp-item {
    background: #fffdfc; border-radius: 16px; padding: 10px;
    box-shadow: 0 6px 16px rgba(120,70,100,.10);
    text-align: center;
  }
  .cp-canvas { width: 100%; max-width: 120px; aspect-ratio: 480/580; border-radius: 12px; }
  .cp-info { margin-top: 6px; font-size: .82rem; line-height: 1.4; }
  .gmark { font-weight: 800; }
  .g-f { color: #e8608e; }
  .g-m { color: #4a8ad0; }
  .cp-tag { color: #8a7a80; font-size: .74rem; display: block; margin-top: 2px; }

  /* 이름 입력 */
  #nameInput {
    margin-top: 26px; font-size: 1.1rem; padding: 12px 18px;
    border-radius: 14px; border: 2px solid #f0c7dc; width: min(320px, 80vw);
    text-align: center; outline: none;
  }
  #nameInput:focus { border-color: var(--accent); }

  /* ── 맵 화면 ───────────────────────────────────────── */
  #mapHeader { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 26px; }
  #mapCards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px; width: 100%; max-width: 980px;
  }
  .place-card {
    --theme: #e0a8c8;
    background: #fffdfc; border-radius: 18px; padding: 18px 18px 16px;
    border-top: 6px solid var(--theme);
    box-shadow: 0 8px 22px rgba(120,70,100,.10);
    cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .place-card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(120,70,100,.18); }
  .place-card h3 { font-size: 1.14rem; }
  .place-desc { font-size: .84rem; color: #8a7a80; line-height: 1.45; min-height: 2.4em; }
  .cast-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
  .cast-chip {
    background: #fff4f8; border: 1px solid #f2dbe8; border-radius: 999px;
    padding: 3px 9px; font-size: .78rem; display: flex; align-items: center; gap: 4px;
  }
  .cast-chip.empty { color: #a79aa0; border-style: dashed; }
  .cc-name { font-weight: 700; }
  .hearts { color: #e8608e; letter-spacing: 1px; font-size: .82rem; }
  .ht-empty { color: #d9c3cf; }
  .btn-train {
    align-self: flex-start; margin-top: 4px;
    background: #fdeef5; border: 1.5px solid var(--theme); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: .82rem; font-weight: 700;
  }
  .btn-train:hover { background: var(--theme); color: #fff; }

  /* ── VN 씬 화면 ────────────────────────────────────── */
  #scr-scene { padding: 0; position: relative; justify-content: flex-end; }
  #vnBg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #fff7fb 0%, #e8b8d055 45%, #e8b8d0 100%);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .vn-portrait { max-height: 74vh; width: auto; filter: drop-shadow(0 12px 20px rgba(60,30,50,.22)); }
  #vnToastLayer { position: absolute; top: 90px; left: 0; right: 0; z-index: 15; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .vn-toast {
    background: #fff; color: var(--accent); font-weight: 800; font-size: 1.1rem;
    padding: 8px 18px; border-radius: 999px; margin-top: 8px;
    box-shadow: 0 6px 16px rgba(120,70,100,.22);
    animation: toastFloat 1.5s ease forwards;
  }
  @keyframes toastFloat {
    0% { opacity: 0; transform: translateY(6px) scale(.9); }
    15% { opacity: 1; transform: translateY(0) scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-18px) scale(.96); }
  }
  #vnNameplate {
    position: relative; z-index: 5; align-self: center;
    background: linear-gradient(135deg, #f486ac, #cd8ae8); color: #fff;
    font-weight: 800; padding: 7px 22px; border-radius: 999px 999px 0 0;
    box-shadow: 0 -4px 14px rgba(120,70,100,.2);
    margin-bottom: -2px;
  }
  #vnDialogue {
    position: relative; z-index: 5;
    background: #fffdfcf2; border-radius: 20px 20px 0 0;
    padding: 22px 28px 26px; min-height: 108px;
    box-shadow: 0 -8px 22px rgba(120,70,100,.16);
    cursor: pointer; width: 100%;
  }
  .vn-text { font-size: 1.08rem; line-height: 1.7; white-space: pre-line; }
  .vn-hint { display: block; text-align: right; margin-top: 8px; color: var(--accent); animation: blink 1.3s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .vn-hint { animation: none; opacity: .7; } }

  #vnChoices {
    position: relative; z-index: 6;
    background: #fffdfc; padding: 20px 24px 26px; width: 100%;
    box-shadow: 0 -8px 22px rgba(120,70,100,.16);
    border-radius: 20px 20px 0 0;
  }
  .choice-q { font-weight: 800; margin-bottom: 14px; font-size: 1.02rem; }
  .choice-row { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    text-align: left; background: #fff4f8; border: 2px solid #f2c9dc; border-radius: 14px;
    padding: 12px 16px; font-size: .96rem; line-height: 1.4; color: var(--ink);
    transition: background .15s ease, border-color .15s ease;
  }
  .choice-btn:hover:not(:disabled) { background: #ffe1ee; border-color: var(--accent); }
  .choice-btn:disabled { opacity: .55; background: #f2eef0; border-color: #ddd0d6; }
  .choice-btn .lock { display: block; margin-top: 4px; font-size: .78rem; color: #b05a7a; font-weight: 700; }

  /* ── 하루 요약 / 엔딩 ─────────────────────────────── */
  .card-panel {
    background: #fffdfc; border-radius: 22px; padding: 34px 32px;
    box-shadow: 0 10px 28px rgba(120,70,100,.14);
    max-width: 480px; width: 100%; text-align: center;
  }
  .card-panel h2 { font-size: 1.5rem; margin-bottom: 18px; color: var(--accent); }
  #deStats { display: flex; justify-content: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
  .de-stat { font-size: .95rem; }
  #deLoves { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .de-love { display: flex; justify-content: space-between; background: #fff4f8; border-radius: 10px; padding: 8px 14px; }
  #deComment { color: #8a7a80; font-size: .92rem; margin-bottom: 8px; }

  #endCard h2 { font-size: 1.6rem; }
  #endCard .hearts { font-size: 1.3rem; display: block; margin: 10px 0; }
  #endCard p { color: #8a7a80; margin: 14px 0 22px; line-height: 1.6; }

  /* ── 모달(단련 결과 / 인물 선택) ──────────────────── */
  #modalLayer[hidden] { display: none; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(60,30,50,.38);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    padding: 20px;
  }
  .modal-box {
    background: #fffdfc; border-radius: 20px; padding: 28px 26px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 16px 40px rgba(60,30,50,.3);
  }
  .modal-box h3 { font-size: 1.15rem; margin-bottom: 12px; }
  .modal-box p { font-size: .92rem; line-height: 1.6; color: #6a5560; margin-bottom: 14px; }
  .toast-inline {
    display: inline-block; background: #ffe1ee; color: var(--accent); font-weight: 800;
    border-radius: 999px; padding: 6px 16px; margin-bottom: 18px; font-size: .92rem;
  }
  .chooser-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
  .chooser-btn {
    background: #fff4f8; border: 2px solid #f2c9dc; border-radius: 14px; padding: 12px;
    font-size: .96rem; font-weight: 700; color: var(--ink);
  }
  .chooser-btn:hover { background: #ffe1ee; border-color: var(--accent); }
  .tag-sp { font-weight: 400; color: #8a7a80; font-size: .82rem; }
</style>
</head>
<body>

  <div id="deco" aria-hidden="true">
    <span style="left:4%; font-size:1.2rem; animation-duration:14s; animation-delay:0s;">♥</span>
    <span style="left:14%; font-size:1.6rem; animation-duration:19s; animation-delay:2s;">✿</span>
    <span style="left:24%; font-size:1rem; animation-duration:16s; animation-delay:5s;">♥</span>
    <span style="left:36%; font-size:1.4rem; animation-duration:21s; animation-delay:1s;">✿</span>
    <span style="left:48%; font-size:1.1rem; animation-duration:15s; animation-delay:7s;">♥</span>
    <span style="left:58%; font-size:1.7rem; animation-duration:23s; animation-delay:3s;">✿</span>
    <span style="left:68%; font-size:1.2rem; animation-duration:17s; animation-delay:6s;">♥</span>
    <span style="left:78%; font-size:1.3rem; animation-duration:20s; animation-delay:4s;">✿</span>
    <span style="left:88%; font-size:1rem; animation-duration:18s; animation-delay:8s;">♥</span>
    <span style="left:94%; font-size:1.5rem; animation-duration:22s; animation-delay:0.5s;">✿</span>
  </div>

  <div id="hud" hidden>
    <span id="hudDay"></span>
    <span id="hudStats" class="hud-stats"></span>
    <button id="hudHome" class="btn-ghost" type="button">처음으로</button>
  </div>

  <main id="app">

    <!-- 타이틀 -->
    <section id="scr-title" class="screen">
      <h1 class="game-title" id="titleName"></h1>
      <p class="game-sub" id="titleSub"></p>
      <div class="btn-row">
        <button id="btnStart" class="btn-primary" type="button">시작하기</button>
        <button id="btnContinue" class="btn-primary" type="button" style="display:none;">이어하기</button>
      </div>
      <div id="castPreview"></div>
    </section>

    <!-- 이름 입력 -->
    <section id="scr-name" class="screen">
      <h1 class="game-title" style="font-size:1.8rem;">당신의 이름은?</h1>
      <p class="game-sub">섬 친구들이 당신을 부를 이름이에요</p>
      <input id="nameInput" type="text" maxlength="8" value="나그네" placeholder="나그네">
      <div class="btn-row">
        <button id="btnNameOk" class="btn-primary" type="button">확인</button>
      </div>
    </section>

    <!-- 맵 -->
    <section id="scr-map" class="screen">
      <h2 id="mapHeader"></h2>
      <div id="mapCards"></div>
    </section>

    <!-- VN 씬 -->
    <section id="scr-scene" class="screen">
      <div id="vnBg">
        <canvas id="vnPortrait" class="vn-portrait" hidden></canvas>
      </div>
      <div id="vnToastLayer"></div>
      <div id="vnNameplate" hidden></div>
      <div id="vnDialogue">
        <p id="vnText" class="vn-text"></p>
        <span id="vnHint" class="vn-hint">▼</span>
      </div>
      <div id="vnChoices" hidden></div>
    </section>

    <!-- 하루 요약 -->
    <section id="scr-dayend" class="screen">
      <div class="card-panel">
        <h2 id="deHeader"></h2>
        <div id="deStats"></div>
        <div id="deLoves"></div>
        <p id="deComment"></p>
        <button id="btnNextDay" class="btn-primary" type="button">다음 날</button>
      </div>
    </section>

    <!-- 엔딩 -->
    <section id="scr-ending" class="screen">
      <div class="card-panel" id="endCard"></div>
    </section>

  </main>

  <div id="modalLayer" hidden></div>

  <script src="../../shared/characters.js"></script>
  <script src="js/story.js"></script>
  <script src="js/portraits.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
